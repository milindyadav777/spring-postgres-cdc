spring.application.name=spring-postgres-cdc
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
spring.datasource.url=${SINK_URL}
spring.datasource.username=${SINK_USER}
spring.datasource.password=${SINK_PASSWORD}
spring.datasource.hikari.maximum-pool-size=6
spring.datasource.hikari.connection-timeout=3000
spring.kafka.bootstrap-servers=${KAFKA_BROKERS}
spring.kafka.consumer.group-id=${CDC_GROUP:order-projector-v1}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=record
spring.kafka.consumer.properties.allow.auto.create.topics=false
management.endpoint.health.group.readiness.include=readinessState,db
