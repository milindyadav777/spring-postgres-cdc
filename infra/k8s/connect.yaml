apiVersion: v1
kind: Service
metadata:
  name: connect
spec:
  selector:
    app.kubernetes.io/name: connect
  ports:
  - name: p-8083
    port: 8083
    targetPort: 8083
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: connect
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: connect
  template:
    metadata:
      labels:
        app.kubernetes.io/name: connect
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
      - name: connect
        image: quay.io/debezium/connect:3.3
        env:
        - name: BOOTSTRAP_SERVERS
          value: kafka-0:9092,kafka-1:9092,kafka-2:9092
        - name: GROUP_ID
          value: orders-connect
        - name: CONFIG_STORAGE_TOPIC
          value: orders-connect-config
        - name: OFFSET_STORAGE_TOPIC
          value: orders-connect-offset
        - name: STATUS_STORAGE_TOPIC
          value: orders-connect-status
        - name: CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR
          value: '3'
        - name: CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR
          value: '3'
        - name: CONNECT_STATUS_STORAGE_REPLICATION_FACTOR
          value: '3'
        - name: CONNECT_CONFIG_PROVIDERS
          value: env
        - name: CONNECT_CONFIG_PROVIDERS_ENV_CLASS
          value: org.apache.kafka.common.config.provider.EnvVarConfigProvider
        - name: CONNECT_CONFIG_PROVIDERS_ENV_PARAM_ALLOWLIST_PATTERN
          value: CAPTURE_PASSWORD
        - name: CONNECT_TOPIC_CREATION_ENABLE
          value: 'false'
        - name: KAFKA_HEAP_OPTS
          value: -Xms160m -Xmx384m
        - name: CAPTURE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: lab-credentials
              key: CAPTURE_PASSWORD
        ports:
        - containerPort: 8083
