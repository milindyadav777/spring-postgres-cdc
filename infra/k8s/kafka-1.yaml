apiVersion: v1
kind: Service
metadata:
  name: kafka-1
spec:
  selector:
    app.kubernetes.io/name: kafka-1
  ports:
  - name: p-9092
    port: 9092
    targetPort: 9092
  - name: p-9093
    port: 9093
    targetPort: 9093
  clusterIP: None
  publishNotReadyAddresses: true
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka-1
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka-1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-1
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
      - name: kafka-1
        image: apache/kafka:4.1.2
        env:
        - name: CLUSTER_ID
          value: MkU3OEVBNTcwNTJENDM2Qk
        - name: KAFKA_NODE_ID
          value: '2'
        - name: KAFKA_PROCESS_ROLES
          value: broker,controller
        - name: KAFKA_CONTROLLER_QUORUM_VOTERS
          value: 1@kafka-0:9093,2@kafka-1:9093,3@kafka-2:9093
        - name: KAFKA_CONTROLLER_LISTENER_NAMES
          value: CONTROLLER
        - name: KAFKA_LISTENERS
          value: PLAINTEXT://:9092,CONTROLLER://:9093
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: KAFKA_ADVERTISED_LISTENERS
          value: PLAINTEXT://kafka-1.$(POD_NAMESPACE).svc:9092
        - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
          value: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
        - name: KAFKA_INTER_BROKER_LISTENER_NAME
          value: PLAINTEXT
        - name: KAFKA_LOG_DIRS
          value: /var/lib/kafka/data/logs
        - name: KAFKA_DEFAULT_REPLICATION_FACTOR
          value: '3'
        - name: KAFKA_MIN_INSYNC_REPLICAS
          value: '2'
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: '3'
        - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
          value: 'false'
        - name: KAFKA_HEAP_OPTS
          value: -Xms160m -Xmx256m
        volumeMounts:
        - name: data
          mountPath: /var/lib/kafka/data
        ports:
        - containerPort: 9092
        - containerPort: 9093
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null
          periodSeconds: 12
          timeoutSeconds: 8
      securityContext:
        fsGroup: 1000
  serviceName: kafka-1
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
