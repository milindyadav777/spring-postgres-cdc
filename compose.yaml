name: spring-postgres-cdc
services:
  source:
    image: postgres:17.11
    environment:
      POSTGRES_USER: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_DB: orders
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/init-env.sh}
      CAPTURE_PASSWORD: ${CAPTURE_PASSWORD:?run scripts/init-env.sh}
    command:
    - postgres
    - -c
    - wal_level=logical
    - -c
    - max_slot_wal_keep_size=1GB
    volumes:
    - source-data:/var/lib/postgresql/data
    - ./infra/source.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -q -h 127.0.0.1 -U postgres -d orders
      interval: 10s
      timeout: 8s
      retries: 25
      start_period: 8s
    restart: unless-stopped
  sink:
    image: postgres:17.11
    environment:
      POSTGRES_USER: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_DB: projection
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/init-env.sh}
      SINK_PASSWORD: ${SINK_PASSWORD:?run scripts/init-env.sh}
    volumes:
    - sink-data:/var/lib/postgresql/data
    - ./infra/sink.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -q -h 127.0.0.1 -U postgres -d projection
      interval: 10s
      timeout: 8s
      retries: 25
      start_period: 8s
    restart: unless-stopped
  kafka-0:
    image: apache/kafka:4.1.2
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: '1'
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-0:9093,2@kafka-1:9093,3@kafka-2:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-0:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data/logs
      KAFKA_DEFAULT_REPLICATION_FACTOR: '3'
      KAFKA_MIN_INSYNC_REPLICAS: '2'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '3'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_HEAP_OPTS: -Xms160m -Xmx256m
    volumes:
    - kafka-0-data:/var/lib/kafka/data
    healthcheck:
      test:
      - CMD-SHELL
      - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null
      interval: 10s
      timeout: 8s
      retries: 25
      start_period: 8s
    restart: unless-stopped
  kafka-1:
    image: apache/kafka:4.1.2
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: '2'
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-0:9093,2@kafka-1:9093,3@kafka-2:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data/logs
      KAFKA_DEFAULT_REPLICATION_FACTOR: '3'
      KAFKA_MIN_INSYNC_REPLICAS: '2'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '3'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_HEAP_OPTS: -Xms160m -Xmx256m
    volumes:
    - kafka-1-data:/var/lib/kafka/data
    healthcheck:
      test:
      - CMD-SHELL
      - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null
      interval: 10s
      timeout: 8s
      retries: 25
      start_period: 8s
    restart: unless-stopped
  kafka-2:
    image: apache/kafka:4.1.2
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: '3'
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-0:9093,2@kafka-1:9093,3@kafka-2:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data/logs
      KAFKA_DEFAULT_REPLICATION_FACTOR: '3'
      KAFKA_MIN_INSYNC_REPLICAS: '2'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '3'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_HEAP_OPTS: -Xms160m -Xmx256m
    volumes:
    - kafka-2-data:/var/lib/kafka/data
    healthcheck:
      test:
      - CMD-SHELL
      - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null
      interval: 10s
      timeout: 8s
      retries: 25
      start_period: 8s
    restart: unless-stopped
  topic-init:
    image: apache/kafka:4.1.2
    entrypoint:
    - sh
    - /config/topic.sh
    depends_on:
      kafka-0:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
    volumes:
    - ./infra/topic.sh:/config/topic.sh:ro
  connect:
    image: quay.io/debezium/connect:3.3
    environment:
      BOOTSTRAP_SERVERS: kafka-0:9092,kafka-1:9092,kafka-2:9092
      GROUP_ID: orders-connect
      CONFIG_STORAGE_TOPIC: orders-connect-config
      OFFSET_STORAGE_TOPIC: orders-connect-offset
      STATUS_STORAGE_TOPIC: orders-connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: '3'
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: '3'
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: '3'
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      CONNECT_CONFIG_PROVIDERS_ENV_PARAM_ALLOWLIST_PATTERN: CAPTURE_PASSWORD
      CONNECT_TOPIC_CREATION_ENABLE: 'false'
      KAFKA_HEAP_OPTS: -Xms160m -Xmx384m
      CAPTURE_PASSWORD: ${CAPTURE_PASSWORD:?run scripts/init-env.sh}
    depends_on:
      source:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully
    restart: unless-stopped
    ports:
    - 127.0.0.1:8083:8083
  register:
    image: curlimages/curl:8.12.1
    entrypoint:
    - sh
    - /config/register.sh
    depends_on:
      connect:
        condition: service_started
    volumes:
    - ./infra/register.sh:/config/register.sh:ro
    - ./infra/connector.json:/config/connector.json:ro
  projector:
    image: spring-postgres-cdc:local
    build: .
    environment:
      SINK_URL: jdbc:postgresql://sink:5432/projection?connectTimeout=3&socketTimeout=10
      SINK_USER: projector
      KAFKA_BROKERS: kafka-0:9092,kafka-1:9092,kafka-2:9092
      SINK_PASSWORD: ${SINK_PASSWORD:?run scripts/init-env.sh}
    depends_on:
      sink:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully
    restart: unless-stopped
    ports:
    - 127.0.0.1:8080:8080
volumes:
  source-data: {}
  sink-data: {}
  kafka-0-data: {}
  kafka-1-data: {}
  kafka-2-data: {}
